[OPTIONS]
; Allows matchmaking to work when the leaderboard API is down/broken
; Only works for non-retail players
IgnoreTrueskill = false
; Enables matchmaking with Retail players
AllowRetailPlayers = true

[DESTINY_OPTIONS]
; Destiny 2.3.1 plaintext packet capture hooks (L3 + R3 + Y, tap LB)
PacketCapture = true
; Per-hook-group switches for bisecting a boot crash (all on). Turn one off per boot.
CaptureHooksBap = true
CaptureHooksXHttp = true
; On-screen counters and PRE-ALPHA BUILD watermark while capturing
CaptureOverlay = true
